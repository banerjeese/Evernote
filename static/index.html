<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notes</title>
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.nt_theme)||"light"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#00a82d;--green-d:#008a25;--side:#2b2b2b;--side-h:#3a3a3a;--side-t:#c8c8c8;--line:#e6e6e6;--bg:#fff;--mid:#f8f8f8;--t:#333;--t2:#8a8a8a;--t3:#6b6b6b;--sel:#e9f7ed;--hov:#fafafa;--inp:#f3f3f3;--ph:#c4c4c4}
[data-theme=dark]{color-scheme:dark;--side:#0d0d0d;--side-h:#1c1c1c;--line:#222;--bg:#000;--mid:#0a0a0a;--t:#e6e6e6;--t2:#8a8a8a;--t3:#9a9a9a;--sel:#0f2a17;--hov:#111;--inp:#161616;--ph:#555}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);font-family:"Source Sans 3","Source Sans Pro",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--t);font-size:14px;overflow:hidden}
button,input,textarea{font:inherit;color:inherit;background:transparent}
.app{display:grid;grid-template-columns:250px 320px 1fr;height:100%}
/* sidebar */
.side{background:var(--side);color:var(--side-t);display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 6px;font-size:18px;font-weight:700;color:#fff;display:flex;align-items:center;gap:10px}
.logo{width:26px;height:26px;border-radius:6px;background:var(--green);display:grid;place-items:center;color:#fff;font-size:15px}
.newbtn{margin:14px 16px 10px;background:var(--green);color:#fff;border:0;border-radius:20px;padding:9px 16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.newbtn:hover{background:var(--green-d)}
.sec{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 6px;font-size:12px;font-weight:600;letter-spacing:.3px;color:#8d8d8d}
.nlist{overflow-y:auto;flex:1;padding-bottom:12px}
.nitem{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 18px;cursor:pointer;border-left:3px solid transparent}
.nitem:hover{background:var(--side-h)}
.nitem.on{background:var(--side-h);border-left-color:var(--green);color:#fff}
.nitem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nitem .ct{font-size:12px;color:#8d8d8d}
.nitem .acts{display:none;gap:2px}
.nitem:hover .acts{display:flex}.nitem:hover .ct{display:none}
.ib{background:none;border:0;cursor:pointer;padding:2px 5px;border-radius:4px;color:inherit;opacity:.8}
.ib:hover{opacity:1;background:rgba(255,255,255,.12)}
.ninput{margin:2px 14px 6px;width:calc(100% - 28px);background:#1f1f1f;border:1px solid var(--green);border-radius:4px;color:#fff;padding:6px 8px;outline:0}
/* middle */
.mid{background:var(--mid);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.mh{padding:16px 18px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh .sub{color:var(--t2);font-size:12px;margin:2px 0 10px}
.row{display:flex;gap:8px}
.search{flex:1;border:1px solid var(--line);border-radius:18px;padding:6px 12px;background:var(--inp);outline:0}
.search:focus{border-color:var(--green);background:var(--bg)}
.add{background:var(--green);color:#fff;border:0;border-radius:18px;padding:6px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.add:hover{background:var(--green-d)}
.slist{overflow-y:auto;flex:1;background:var(--bg)}
.card{padding:13px 18px;border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent;position:relative}
.card:hover{background:var(--hov)}
.card.on{background:var(--sel);border-left-color:var(--green)}
.card .tt{font-weight:600;font-size:15px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sn{color:var(--t3);font-size:13px;line-height:1.35;max-height:36px;overflow:hidden}
.card .dt{color:var(--t2);font-size:12px;margin-top:6px}
.empty{padding:50px 24px;text-align:center;color:var(--t2);line-height:1.5}
/* editor */
.ed{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.tb{height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:var(--t2);font-size:12px}
.del{background:none;border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer;color:#e0503f;margin-left:6px}
.tbtn{background:none;border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer;color:var(--t2);margin-left:6px}
.tbtn:hover{background:var(--hov);color:var(--t)}
.del:hover{background:rgba(224,80,63,.12);border-color:rgba(224,80,63,.5)}
.body{flex:1;overflow-y:auto;padding:28px 48px;display:flex;flex-direction:column}
.title{border:0;outline:0;font-size:30px;font-weight:700;width:100%;padding:0 0 12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.title::placeholder{color:var(--ph)}
.desc{flex:1;outline:0;font-size:16px;line-height:1.65;width:100%;min-height:300px;white-space:pre-wrap;word-break:break-word;padding-bottom:30vh;-webkit-tap-highlight-color:transparent}
.desc>div{min-height:1.65em}
.desc .b{position:relative;padding-left:1.8em}
.desc .b::before{content:"•";position:absolute;left:.6em}
.desc .h{font-size:1.3em;font-weight:700;line-height:1.4;margin:.55em 0 .1em}
.desc.empty>div:first-child::before{content:"Start writing…";color:var(--ph);pointer-events:none}
.desc .i{position:relative;margin:.5em 0;user-select:none;-webkit-user-select:none}
.desc .i .w{position:relative;display:block;width:fit-content;max-width:100%}
.desc .i .w[style] img{width:100%}
.desc .i img{display:block;max-width:100%;height:auto;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.desc .i.sel img{outline:3px solid var(--green)}
.desc .i .x{position:absolute;top:6px;right:6px;display:none;width:28px;height:28px;padding:0;border:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:18px;line-height:28px;cursor:pointer}
.desc .i:hover .x,.desc .i.sel .x{display:block}
.desc .i .rz{position:absolute;right:5px;bottom:5px;width:18px;height:18px;border:2px solid #fff;border-radius:4px;background:var(--green);opacity:.8;cursor:nwse-resize;touch-action:none;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.desc .i .rz:hover{opacity:1}
.lb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);display:flex;overflow:auto}
.lb img{margin:auto;max-width:100vw;max-height:100vh;object-fit:contain;cursor:zoom-in}
.lb img.full{max-width:none;max-height:none;cursor:zoom-out}
.lbbar{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;display:flex;gap:8px;z-index:101}
.lbb{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:18px;display:grid;place-items:center;cursor:pointer;text-decoration:none}
.lbb:hover{background:rgba(255,255,255,.35)}
.panels{display:contents}
.tbl{display:flex;align-items:center;gap:8px}.tbl .tbtn{margin-left:0}
#menu,.scrim,#toNotes,.brand .themebtn{display:none}
.brand .themebtn{margin-left:auto;font-size:16px}
#toNotes{margin:0 0 8px}
@media(min-width:641px){
.app.focus{grid-template-columns:1fr}
.app.focus .side,.app.focus .mid{display:none}
.app.focus .body{max-width:900px;width:100%;margin:0 auto}
}
.hide{display:none!important}
@media(max-width:900px){.app{grid-template-columns:200px 260px 1fr}.body{padding:20px}}
@media(max-width:640px){
.app{display:block;height:100dvh}
.panels{display:flex;position:fixed;top:0;left:0;bottom:0;width:min(88vw,360px);z-index:50;transform:translateX(-103%);transition:transform .22s ease;box-shadow:4px 0 24px rgba(0,0,0,.35)}
.app.drawer .panels{transform:none}
.side,.mid{width:100%;flex:none;height:100%}
.mid{display:none}.app.lvl2 .mid{display:flex}.app.lvl2 .side{display:none}
.scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .22s}
.app.drawer .scrim{opacity:1;pointer-events:auto}
.ed{height:100dvh}
#menu,#toNotes,.brand .themebtn{display:inline-block}#focus{display:none}
.tb{padding:0 12px}
.body{padding:16px 18px}.title{font-size:24px}
.search,.ninput{font-size:16px}
.nitem{padding:11px 10px 11px 18px}
.nitem .acts{display:flex}.nitem .ct,.nitem:hover .ct{display:inline}
.ib{padding:6px 9px}
.desc .i .rz{width:26px;height:26px}
}
@media(prefers-reduced-motion:reduce){.panels,.scrim{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="panels">
  <aside class="side">
    <div class="brand"><span class="logo">✎</span>Notes<button class="ib themebtn" title="Dark / light mode">🌙</button></div>
    <button class="newbtn" id="newNote">＋ New Note</button>
    <div class="sec">NOTES</div>
    <div class="nlist" id="nlist"></div>
  </aside>
  <section class="mid">
    <div class="mh">
      <button class="tbtn" id="toNotes">‹ Notes</button>
      <h2 id="mtitle">Select a note</h2>
      <div class="sub" id="msub"></div>
      <div class="row"><input class="search" id="q" placeholder="Search subnotes"><button class="add" id="newSub">＋ New</button></div>
    </div>
    <div class="slist" id="slist"><div class="empty">Pick a note on the left to see its subnotes.</div></div>
  </section>
  </div>
  <div class="scrim" id="scrim"></div>
  <main class="ed">
    <div class="tb"><span class="tbl"><button class="tbtn" id="menu" title="Notes and subnotes">☰</button><span id="status"></span></span><span><button class="tbtn hide" id="imgBtn" title="Insert image (or just paste / drop one)">🖼</button><input type="file" id="file" accept="image/*" multiple hidden><button class="tbtn themebtn" title="Dark / light mode">🌙</button><button class="tbtn" id="focus" title="Hide / show side panels (Ctrl+\)">⇤ Hide panels</button><button class="del hide" id="delSub">Delete</button></span></div>
    <div class="body hide" id="edbody">
      <input class="title" id="title" placeholder="Title" maxlength="255">
      <div class="desc empty" id="desc" contenteditable="true" spellcheck="true"><div><br></div></div>
    </div>
    <div class="empty" id="edempty" style="margin-top:80px">Select a subnote to read or edit it.</div>
  </main>
</div>
<div class="lb hide" id="lb"><div class="lbbar"><a class="lbb" id="lbDl" title="Save image">⬇</a><button class="lbb" id="lbDel" title="Delete image">🗑</button><button class="lbb" id="lbX" title="Close">✕</button></div><img id="lbImg" alt=""></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(m,u,b)=>{const r=await fetch('/api'+u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});if(!r.ok)throw new Error(r.status);return r.json()};
const fmt=(d,t)=>{if(!d)return'';const x=new Date(d+'T00:00');return x.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+(t?' · '+t:'')};

let notes=[], subs={}, descs={}, curNote=null, curSub=null, pending=null, timer=null, filter='';

/* ---------- description editor: line blocks (normal / bullet 'b' / heading 'h') ---------- */
const ed=$('#desc'), MARK=['▸ ','🔴 '], KEEP=new Set(['b','h']);
const blk=(c,t)=>`<div${KEEP.has(c)?` class="${c}"`:''}>${t?esc(t):'<br>'}</div>`;
function toHTML(raw){            // db value -> editor html (old plain-text notes still work)
  if(!raw)return'<div><br></div>';
  if(raw.startsWith('<!--rt-->')){
    const d=new DOMParser().parseFromString(raw,'text/html');
    return [...d.body.children].map(x=>x.classList.contains('i')&&/^\d+$/.test(x.dataset.id||'')?imgHTML(x.dataset.id,+x.dataset.w>=10&&+x.dataset.w<=100?+x.dataset.w:0):blk(x.className,x.textContent)).join('')||'<div><br></div>';
  }
  return raw.split('\n').map(l=>blk('',l)).join('');
}
const toRaw=()=>'<!--rt-->'+[...ed.children].map(d=>isImg(d)?`<div class="i" data-id="${d.dataset.id}"${d.dataset.w?` data-w="${d.dataset.w}"`:''}></div>`:blk(d.className,d.textContent.replace(/\u00a0/g,' '))).join('').replace(/<br>/g,'');
const plain=()=>[...ed.children].map(d=>isImg(d)?'🖼':d.textContent).join(' ').replace(/\s+/g,' ').trim();
const refreshEmpty=()=>ed.classList.toggle('empty',ed.children.length===1&&!ed.firstChild.className&&!ed.textContent);
function setDesc(raw){ed.innerHTML=toHTML(raw);refreshEmpty()}
function place(n,o){const r=document.createRange();r.setStart(n,o);r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r)}
function toEnd(){const l=ed.lastChild,t=l.lastChild;t&&t.nodeType===3?place(t,t.length):place(l,0)}
const blockOf=n=>{while(n&&n.parentNode!==ed)n=n.parentNode;return n&&n.nodeType===1&&n.tagName==='DIV'?n:null};
const headText=(b,r)=>{const x=document.createRange();x.setStart(b,0);x.setEnd(r.startContainer,r.startOffset);return x.toString()};
const fill=b=>{if(!b.textContent&&!b.querySelector('br'))b.appendChild(document.createElement('br'))};
function fixup(){                // keep editor children as <div> lines only
  const sel=getSelection(),an=sel.anchorNode,ao=sel.anchorOffset,foc=document.activeElement===ed;let moved=false;
  [...ed.childNodes].forEach(n=>{
    if(n.nodeType===1&&n.tagName==='DIV')return; moved=true;
    if(n.nodeType===1&&n.tagName==='BR'){n.remove();return}
    const d=document.createElement('div');n.replaceWith(d);d.appendChild(n);
  });
  if(!ed.firstChild){ed.innerHTML='<div><br></div>';moved=true}
  if(isImg(ed.lastElementChild)){const d=document.createElement('div');d.innerHTML='<br>';ed.append(d)}
  if(moved&&foc){an&&an!==ed&&ed.contains(an)?place(an,ao):place(ed.firstChild,0)}
}
function enter(){
  fixup(); const sel=getSelection(); if(!sel.rangeCount)return; let r=sel.getRangeAt(0);
  if(!r.collapsed){r.deleteContents();r=sel.getRangeAt(0)}
  const b=blockOf(r.startContainer); if(!b)return;
  if(isImg(b)){const nb=document.createElement('div');nb.innerHTML='<br>';b.after(nb);place(nb,0);return}
  const cls=b.className, tr=document.createRange(); tr.selectNodeContents(b); tr.setStart(r.startContainer,r.startOffset);
  const tail=tr.extractContents(), head=b.textContent, tailTxt=tail.textContent;
  const mk=MARK.find(m=>head.startsWith(m)||head===m.trim());
  if(cls==='b'&&!head&&!tailTxt){b.className='';fill(b);place(b,0);return}                       // 2nd Enter leaves the bullet list
  if(mk&&head.trim()===mk.trim()&&!tailTxt){b.textContent='';fill(b);place(b,0);return}          // 2nd Enter leaves ▸ / 🔴 list
  const nb=document.createElement('div'); if(cls==='b')nb.className='b';
  const keep=mk&&head.length>=mk.length?mk:'';                                                   // ▸ / 🔴 lines continue
  if(keep)nb.appendChild(document.createTextNode(keep));
  nb.appendChild(tail); fill(b); fill(nb); b.after(nb);
  keep?place(nb.firstChild,keep.length):place(nb,0);
  nb.scrollIntoView({block:'nearest'});
}
const TRIG=/^(-|>>|>|redimp)[ \u00a0]$/i;
function shortcuts(){            // runs after typing; converts "- ", ">> ", "> ", "redimp " at the caret
  const sel=getSelection(); if(!sel.rangeCount||!sel.isCollapsed)return; const r=sel.getRangeAt(0),b=blockOf(r.startContainer); if(!b||isImg(b))return;
  const m=headText(b,r).match(TRIG); if(!m)return; const k=m[1].toLowerCase();
  if((k==='-'||k==='>>')&&b.className)return;
  const x=document.createRange();x.setStart(b,0);x.setEnd(r.startContainer,r.startOffset);x.deleteContents();
  if(k==='-'){b.className='b';fill(b);place(b.firstChild&&b.firstChild.nodeType===3?b.firstChild:b,0)}
  else if(k==='>>'){b.className='h';fill(b);place(b.firstChild&&b.firstChild.nodeType===3?b.firstChild:b,0)}
  else document.execCommand('insertText',false,k==='>'?'▸ ':'🔴 ');
}
ed.addEventListener('beforeinput',e=>{
  const t=e.inputType;
  if(t==='insertParagraph'||t==='insertLineBreak'){e.preventDefault();enter();edit();return}
  if(t==='deleteContentBackward'||t==='deleteContentForward'){
    const si=ed.querySelector('.i.sel'); if(si){e.preventDefault();removeImg(si);return}              // selected image -> delete it
    const sel=getSelection(); if(!sel.rangeCount||!sel.isCollapsed)return;
    const r=sel.getRangeAt(0), b=blockOf(sel.anchorNode); if(!b||isImg(b))return;
    if(t==='deleteContentBackward'){
      if(!headText(b,r)){
        const pv=b.previousElementSibling;
        if(pv&&isImg(pv)){e.preventDefault();markSel(pv);return}                                   // 1st Backspace selects the image above
        if(b.className){e.preventDefault();b.className='';edit()}                                  // bullet/heading -> normal line
      }
    }else{
      const x=document.createRange();x.selectNodeContents(b);x.setStart(r.startContainer,r.startOffset);
      const nx=b.nextElementSibling; if(!x.toString()&&isImg(nx)){e.preventDefault();markSel(nx)}   // Delete at line end selects image below
    }
  }
});
ed.addEventListener('input',e=>{if(!e.isComposing){fixup();shortcuts()}edit()});
ed.addEventListener('compositionend',()=>setTimeout(()=>{shortcuts();edit()},0));
ed.addEventListener('paste',e=>{                       // image -> inserted; else plain text ("- item" lines become bullets)
  const imgs=[...e.clipboardData.files].filter(f=>f.type.startsWith('image/'));
  if(imgs.length&&!e.clipboardData.getData('text/plain')){e.preventDefault();addImages(imgs);return}
  e.preventDefault(); const t=(e.clipboardData.getData('text/plain')||'').replace(/\r/g,'');
  t.split('\n').forEach((ln,i)=>{
    if(i)enter(); const m=ln.match(/^\s*[-*•]\s+(.*)$/);
    if(m){const b=blockOf(getSelection().anchorNode);if(b&&!b.className&&!b.textContent)b.className='b';ln=m[1]}
    if(ln)document.execCommand('insertText',false,ln);
  }); edit();
});

/* ---------- inline images (stored in MySQL table note_images, placed only between text lines) ---------- */
const isImg=n=>!!n&&!!n.classList&&n.classList.contains('i');
const imgHTML=(id,w)=>`<div class="i" data-id="${id}"${w?` data-w="${w}"`:''} contenteditable="false"><span class="w"${w?` style="width:${w}%"`:''}><img src="/api/images/${id}" alt="" draggable="false"><button class="x" type="button" title="Remove image">×</button><span class="rz" title="Drag to resize"></span></span></div>`;
let saved=null, selAt=0;
const clearSel=()=>ed.querySelectorAll('.i.sel').forEach(n=>n.classList.remove('sel'));
const markSel=n=>{clearSel();n.classList.add('sel');selAt=Date.now()};
document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount&&ed.contains(s.anchorNode)){saved=s.getRangeAt(0).cloneRange();if(Date.now()-selAt>300)clearSel()}});
function removeImg(n){const id=n.dataset.id;n.remove();api('DELETE','/images/'+id).catch(()=>{});fixup();refreshEmpty();edit()}
ed.addEventListener('click',e=>{
  if(e.target.closest('.rz'))return;
  const x=e.target.closest('.x'); if(x){removeImg(x.closest('.i'));return}
  const im=e.target.closest('.i'); clearSel();
  if(im&&e.target.tagName==='IMG')openLb(im.dataset.id);                 // tap image -> full view
});
ed.addEventListener('pointerdown',e=>{                                    // drag the green corner to resize (saved as % of page width)
  const h=e.target.closest('.rz'); if(!h)return; e.preventDefault(); e.stopPropagation();
  const box=h.closest('.i'), w=h.closest('.w'), full=box.clientWidth, x0=e.clientX, w0=w.getBoundingClientRect().width;
  h.setPointerCapture(e.pointerId);
  const mv=ev=>{const pct=Math.round(Math.max(60,Math.min(full,w0+ev.clientX-x0))/full*100);w.style.width=pct+'%';box.dataset.w=pct};
  const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);edit()};
  h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
});
/* full-view lightbox: tap picture to zoom between fit / actual size; Esc or tap outside to close */
const lb=$('#lb'), lbImg=$('#lbImg'); let lbId=null;
function openLb(id){lbId=id;lbImg.classList.remove('full');lbImg.src='/api/images/'+id;$('#lbDl').href='/api/images/'+id;$('#lbDl').download='image-'+id;lb.classList.remove('hide')}
function closeLb(){lb.classList.add('hide');lbImg.removeAttribute('src');lbId=null}
lb.onclick=e=>{if(e.target===lb)closeLb()};
lbImg.onclick=()=>lbImg.classList.toggle('full');
$('#lbX').onclick=closeLb;
$('#lbDel').onclick=()=>{if(!confirm('Delete this image?'))return;const n=ed.querySelector(`.i[data-id="${lbId}"]`);closeLb();if(n)removeImg(n)};
addEventListener('keydown',e=>{if(e.key==='Escape'&&!lb.classList.contains('hide'))closeLb()});
function pickRange(){const s=getSelection();if(s.rangeCount&&ed.contains(s.anchorNode))return s.getRangeAt(0).cloneRange();return saved&&ed.contains(saved.startContainer)?saved.cloneRange():null}
async function shrink(f){                      // keep uploads small: max 1600px wide, JPEG unless already small
  if(f.type==='image/gif')return f;
  try{
    const bmp=await createImageBitmap(f), k=Math.min(1,1600/bmp.width);
    if(k===1&&f.size<700e3)return f;
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85)); return b&&b.size<f.size?b:f;
  }catch{return f}
}
async function addImages(files){
  if(!curSub)return; const sid=curSub;
  for(const f of files){
    const at=pickRange(); $('#status').textContent='Uploading image…';
    try{
      const b=await shrink(f);
      const r=await fetch(`/api/subnotes/${sid}/images`,{method:'POST',headers:{'Content-Type':b.type||f.type},body:b});
      if(!r.ok)throw 0; const {id}=await r.json();
      if(curSub===sid)putImage(id,at);
    }catch{$('#status').textContent='Image upload failed';alert('Could not upload the image (png, jpg, gif or webp, up to ~8 MB).')}
  }
}
function putImage(id,at){
  fixup(); const sel=getSelection();
  if(at&&ed.contains(at.startContainer)){sel.removeAllRanges();sel.addRange(at)}else toEnd();
  let r=sel.getRangeAt(0); if(!r.collapsed){r.deleteContents();r=sel.getRangeAt(0)}
  const t=document.createElement('template');t.innerHTML=imgHTML(id);const im=t.content.firstChild,b=blockOf(r.startContainer);
  if(!b)ed.append(im);
  else if(isImg(b))b.after(im);
  else{
    const head=headText(b,r),tr=document.createRange();tr.selectNodeContents(b);tr.setStart(r.startContainer,r.startOffset);const tailTxt=tr.toString();
    if(!head&&!tailTxt&&!b.className)b.replaceWith(im);                  // empty line becomes the image
    else if(!head)b.before(im);                                          // caret at line start: image goes above
    else if(!tailTxt)b.after(im);                                        // caret at line end: image goes below
    else{const nb=document.createElement('div');nb.appendChild(tr.extractContents());fill(b);fill(nb);b.after(im);im.after(nb)}   // mid-line: split
  }
  const mk=()=>{const d=document.createElement('div');d.innerHTML='<br>';return d};
  if(!im.previousElementSibling)im.before(mk());
  let nx=im.nextElementSibling; if(!nx||isImg(nx)){nx=mk();im.after(nx)}
  place(nx,0); if(!mob())ed.focus({preventScroll:true}); nx.scrollIntoView({block:'nearest'}); refreshEmpty(); edit();
}
ed.addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files'))e.preventDefault()});
ed.addEventListener('drop',e=>{
  const files=[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')); if(!files.length)return; e.preventDefault();
  let r=document.caretRangeFromPoint?document.caretRangeFromPoint(e.clientX,e.clientY):null;
  if(!r&&document.caretPositionFromPoint){const p=document.caretPositionFromPoint(e.clientX,e.clientY);if(p){r=document.createRange();r.setStart(p.offsetNode,p.offset)}}
  if(r&&ed.contains(r.startContainer)){const s=getSelection();s.removeAllRanges();s.addRange(r)}
  addImages(files);
});

/* ---------- remembered UI state (survives refresh) ---------- */
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem('nt_'+k));return v??d}catch{return d}},set(k,v){try{localStorage.setItem('nt_'+k,JSON.stringify(v))}catch{}}};
function setTheme(t){document.documentElement.dataset.theme=t;document.querySelectorAll('.themebtn').forEach(b=>b.textContent=t==='dark'?'☀️':'🌙');LS.set('theme',t)}
function setFocus(on){$('#app').classList.toggle('focus',on);$('#focus').textContent=on?'⇥ Show panels':'⇤ Hide panels';LS.set('focus',on)}
document.querySelectorAll('.themebtn').forEach(b=>b.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
$('#focus').onclick=()=>setFocus(!$('#app').classList.contains('focus'));
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='\\'){e.preventDefault();$('#focus').click()}});
/* phone: notes + subnotes live in a left drawer */
const mob=()=>matchMedia('(max-width:640px)').matches;
const openDrawer=()=>{$('#app').classList.add('drawer');$('#app').classList.toggle('lvl2',!!curNote)};
const closeDrawer=()=>$('#app').classList.remove('drawer');
$('#imgBtn').onmousedown=e=>e.preventDefault(); $('#imgBtn').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=[...e.target.files];e.target.value='';if(f.length)addImages(f)};
$('#menu').onclick=openDrawer; $('#scrim').onclick=closeDrawer; $('#toNotes').onclick=()=>$('#app').classList.remove('lvl2');
setTheme(document.documentElement.dataset.theme||'light'); setFocus(LS.get('focus',false));

/* ---------- notes ---------- */
async function loadNotes(){notes=await api('GET','/notes');renderNotes()}
function renderNotes(){
  $('#nlist').innerHTML=notes.map(n=>`<div class="nitem ${n.id===curNote?'on':''}" data-id="${n.id}">
    <span>📓</span><span class="nm">${esc(n.topic)}</span><span class="ct">${n.cnt}</span>
    <span class="acts"><button class="ib" data-a="ren" title="Rename">✎</button><button class="ib" data-a="del" title="Delete">🗑</button></span></div>`).join('')
    || '<div class="empty" style="color:#888">No notes yet.<br>Click “New Note”.</div>';
}
$('#nlist').onclick=async e=>{
  const it=e.target.closest('.nitem'); if(!it)return; const id=+it.dataset.id, n=notes.find(x=>x.id===id), a=e.target.dataset.a;
  if(a==='ren'){const t=prompt('Rename note',n.topic);if(t&&t.trim()){n.topic=t.trim();renderNotes();if(id===curNote)$('#mtitle').textContent=n.topic;api('PATCH','/notes/'+id,{topic:n.topic})}return}
  if(a==='del'){if(!confirm(`Delete “${n.topic}” and all its subnotes?`))return;notes=notes.filter(x=>x.id!==id);delete subs[id];if(curNote===id){curNote=null;curSub=null;LS.set('note',null);LS.set('sub',null);showEditor(false);$('#app').classList.remove('lvl2');$('#mtitle').textContent='Select a note';$('#msub').textContent='';$('#slist').innerHTML='<div class="empty">Pick a note on the left to see its subnotes.</div>'}renderNotes();api('DELETE','/notes/'+id);return}
  selectNote(id);
};
$('#newNote').onclick=()=>{
  if($('.ninput'))return;
  const i=document.createElement('input');i.className='ninput';i.placeholder='Note name, then Enter';
  $('#nlist').prepend(i);i.focus();
  let done=false;const fin=async ok=>{if(done)return;done=true;const t=i.value.trim();i.remove();if(ok&&t){const n=await api('POST','/notes',{topic:t});notes.unshift(n);subs[n.id]=[];renderNotes();selectNote(n.id)}};
  i.onkeydown=e=>{if(e.key==='Enter')fin(true);if(e.key==='Escape')fin(false)};i.onblur=()=>fin(true);
};

/* ---------- subnotes ---------- */
async function selectNote(id,quiet){
  await flush(); curNote=id; curSub=null; LS.set('note',id); LS.set('sub',null); showEditor(false); filter=''; $('#q').value=''; $('#app').classList.add('lvl2'); if(!quiet)$('#app').classList.add('drawer');
  const n=notes.find(x=>x.id===id); $('#mtitle').textContent=n.topic; renderNotes();
  if(subs[id]) renderSubs(); else $('#slist').innerHTML='<div class="empty">Loading…</div>';
  const fresh=await api('GET',`/notes/${id}/subnotes`);   // always refresh in background
  subs[id]=fresh; if(curNote===id)renderSubs();
}
function renderSubs(){
  const list=(subs[curNote]||[]), f=filter.toLowerCase();
  const rows=f?list.filter(s=>(s.topic+' '+s.snippet).toLowerCase().includes(f)):list;
  $('#msub').textContent=list.length+(list.length===1?' subnote':' subnotes');
  $('#slist').innerHTML=rows.map(s=>`<div class="card ${s.id===curSub?'on':''}" data-id="${s.id}">
    <div class="tt">${esc(s.topic)||'Untitled'}</div><div class="sn">${esc(s.snippet)}</div><div class="dt">${fmt(s.date,s.time)}</div></div>`).join('')
    ||`<div class="empty">${f?'No matches.':'No subnotes yet.<br>Click “＋ New” to add one.'}</div>`;
  const n=notes.find(x=>x.id===curNote); if(n&&n.cnt!==list.length){n.cnt=list.length;renderNotes()}
}
$('#q').oninput=e=>{filter=e.target.value;if(curNote)renderSubs()};
$('#slist').onclick=e=>{const c=e.target.closest('.card');if(c)openSub(+c.dataset.id)};
$('#newSub').onclick=async()=>{
  if(!curNote)return alert('Select or create a note first.');
  await flush();
  const s=await api('POST',`/notes/${curNote}/subnotes`,{topic:'Untitled'});
  subs[curNote].unshift(s);descs[s.id]='';renderSubs();await openSub(s.id);$('#title').select();
};
async function openSub(id){
  await flush(); curSub=id; LS.set('sub',id); renderSubs(); showEditor(true); closeDrawer();
  const s=subs[curNote].find(x=>x.id===id);
  $('#title').value=s.topic; setDesc(descs[id]??''); $('#status').textContent=fmt(s.date,s.time);
  if(descs[id]===undefined){
    ed.contentEditable='false'; const r=await api('GET','/subnotes/'+id); descs[id]=r.description;
    ed.contentEditable='true'; if(curSub===id){setDesc(r.description);if(!mob()){ed.focus();toEnd()}}
  } else if(!mob()){ed.focus();toEnd()}
}
function showEditor(on){$('#edbody').classList.toggle('hide',!on);$('#edempty').classList.toggle('hide',on);$('#delSub').classList.toggle('hide',!on);$('#imgBtn').classList.toggle('hide',!on);if(!on)$('#status').textContent=''}
$('#delSub').onclick=()=>{
  if(!curSub||!confirm('Delete this subnote?'))return;
  clearTimeout(timer);pending=null;const id=curSub;
  subs[curNote]=subs[curNote].filter(x=>x.id!==id);curSub=null;LS.set('sub',null);showEditor(false);renderSubs();if(mob())openDrawer();api('DELETE','/subnotes/'+id);
};

/* ---------- autosave (debounced) ---------- */
function edit(){
  if(!curSub)return; const s=subs[curNote].find(x=>x.id===curSub), t=$('#title').value, d=toRaw();
  s.topic=t; s.snippet=plain().slice(0,140); refreshEmpty(); descs[curSub]=d; pending={id:curSub,topic:t||'Untitled',description:d};
  const c=document.querySelector(`.card[data-id="${curSub}"]`); if(c){c.querySelector('.tt').textContent=t||'Untitled';c.querySelector('.sn').textContent=s.snippet}
  $('#status').textContent='Saving…'; clearTimeout(timer); timer=setTimeout(flush,600);
}
async function flush(){
  clearTimeout(timer); if(!pending)return; const p=pending; pending=null;
  try{await api('PATCH','/subnotes/'+p.id,{topic:p.topic,description:p.description});if(curSub===p.id)$('#status').textContent='Saved'}
  catch{pending=pending||p;$('#status').textContent='Save failed — retrying';timer=setTimeout(flush,3000)}
}
$('#title').oninput=edit;
$('#title').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ed.focus();place(ed.firstChild,0)}};
addEventListener('beforeunload',()=>{if(pending)navigator.sendBeacon&&fetch('/api/subnotes/'+pending.id,{method:'PATCH',keepalive:true,headers:{'Content-Type':'application/json'},body:JSON.stringify(pending)})});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
if(mob()&&!LS.get('sub'))openDrawer();
(async()=>{
  await loadNotes();
  const n=LS.get('note'), sid=LS.get('sub');   // jump back to where you were writing
  if(n&&notes.some(x=>x.id===n)){
    await selectNote(n,true);
    if(sid&&(subs[n]||[]).some(x=>x.id===sid))await openSub(sid);
  }
  if(mob()&&!curSub)openDrawer();
})();
</script>
</body>
